# G5 part A on the iOS simulator: a report that was published. It opens for reading only, with a banner that names the version; "Edit and
# republish" opens it again; a publish with nothing said is answered "nothing changed". Same as maestro/golden/g5-a-published-report.yaml except
# for the sign-in (maestro/ios/sign-in.yaml, https) and the checkbox state: the "unticked" check is left to the caller, which asks the
# engine (the app sends no notice choice for an unticked box), because whether a web checkbox reports "checked" to Maestro on iOS is not verified.
#
#   maestro --platform ios --device <udid> test -e SERVER_URL=https://localhost:<port> maestro/ios/g5-a-published-report.yaml
#
# The engine must run with `--scenario published` over https; scripts/ios-simulator-published.sh does all of it and checks the engine between the parts.
appId: io.inspectorhub.app
---
# Starts from either app: a fresh one on the server screen, or (after scripts/ios-simulator-published.sh restarted the app because Maestro lost
# its XCUITest transport) one that is already signed in on the work list. Wait for whichever appears, and sign in only on the first.
- extendedWaitUntil:
    visible: "Choose your server|Download today's work"
    timeout: 90000
- runFlow:
    when:
      visible: "Choose your server"
    file: sign-in.yaml
    env:
      SERVER_URL: ${SERVER_URL}
# Sign-in ends on Settings, scrolled down to its last row, so the button at the top may be off screen; a restarted app is already on the work
# list, where the button does not exist (the scroll then gives up quietly and the next step is skipped).
- scrollUntilVisible:
    element: "Back to work list"
    direction: UP
    timeout: 8000
    optional: true
- runFlow:
    when:
      visible: "Back to work list"
    commands:
      - tapOn: "Back to work list"
- retry:
    maxRetries: 4
    commands:
      - tapOn: "Download today's work"
      - extendedWaitUntil:
          visible: "Updated 1 inspection."
          timeout: 20000
- tapOn: "Open 77 Test Photo Lane"
# Published: read-only, with the version in the banner and the one way forward.
- extendedWaitUntil:
    visible: "Published as version 3. It cannot change until you choose Edit and republish."
    timeout: 30000
- assertVisible: "Edit and republish"
- assertNotVisible: "Publish update"
# Reading only: the item opens, but nothing offers to add a photo.
- tapOn: "ITEMS"
- tapOn: "A Roof cover"
- assertNotVisible: "Add photo"
- scrollUntilVisible:
    element: "Edit and republish"
    direction: UP
    optional: true
- tapOn: "Edit and republish"
# The server opened it and the editor started again, now editable and saying what clients still see.
- extendedWaitUntil:
    visible: "Editing again. Clients still see version 3 until you publish the update."
    timeout: 60000
- assertNotVisible: "Edit and republish"
- assertVisible: "Publish update"
# Publish with nothing said: "nothing changed", and the notice box starts unticked.
- tapOn: "Publish update"
- extendedWaitUntil:
    visible: "Send the report-updated notices"
    timeout: 20000
- assertVisible: "Send the report-updated notices"
- tapOn: "Just publish"
- extendedWaitUntil:
    visible: "Nothing to publish"
    timeout: 60000
- assertVisible: "Nothing changed since version 3, so nothing was published and no notices were sent."
