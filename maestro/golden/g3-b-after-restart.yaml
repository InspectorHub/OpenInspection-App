# G3 part B and G4: the app was killed with the photo still waiting (the engine is still off). After the restart the item, the photo and
# its thumbnail are back, and the thumbnail is a picture, not a placeholder (G4: compared with a reference of the same fixture).
# The script that runs this starts the app first (am start; see g2-controlled-sign-in.yaml for why Maestro does not).
appId: io.inspectorhub.app
---
- extendedWaitUntil:
    visible: "Work list"
    timeout: 60000
# With a photo still waiting the app offers to show upload progress as a notification. Not needed here, and it would hide the work list. It is asked once, so a second run on the same install does not see it.
- tapOn:
    text: "Not now"
    optional: true
- tapOn: "Open 77 Test Photo Lane"
- extendedWaitUntil:
    visible: "ITEMS"
    timeout: 30000
- tapOn: "ITEMS"
- tapOn: "A Roof cover"
- extendedWaitUntil:
    visible: "1 photo"
    timeout: 30000
# Still not uploaded: the engine is off.
- assertVisible: "UPLOADING"
# G4: the tile (the node that carries the UPLOADING badge covers the whole tile) must look like the reference, which is the same fixture
# photo as the app showed it. A placeholder, a flat grey or an empty tile is far below the threshold. To renew the reference after a
# change to the tile's look, run this flow with takeScreenshot (same path and cropOn) instead and review the picture before committing it.
# The tile can be caught half drawn (assertScreenshot does not retry by itself), so wait for the screen to be still and try up to three times.
- waitForAnimationToEnd:
    timeout: 5000
- retry:
    maxRetries: 3
    commands:
      - assertScreenshot:
          path: references/g4-thumbnail-offline
          thresholdPercentage: 90
          cropOn:
            text: "UPLOADING"
