# G3 part B and G4: the app was killed with the photo still waiting (the engine is still off). After the restart the item, the photo and
# its thumbnail are back, and the thumbnail is a picture, not a placeholder (G4: judged by the script from the screenshot this flow takes).
# The script that runs this starts the app first (am start; see g2-controlled-sign-in.yaml for why Maestro does not).
appId: io.inspectorhub.app
---
- extendedWaitUntil:
    visible: "Work list"
    timeout: 60000
# With a photo still waiting the app offers to show upload progress as a notification. Not needed here, and it would hide the work list. It is asked once, so a second run on the same install does not see it.
- tapOn:
    text: "Not now"
    optional: true
- tapOn: "Open 77 Test Photo Lane"
- extendedWaitUntil:
    visible: "ITEMS"
    timeout: 30000
- tapOn: "ITEMS"
- tapOn: "A Roof cover"
- extendedWaitUntil:
    visible: "1 photo"
    timeout: 30000
# Still not uploaded: the engine is off.
- assertVisible: "UPLOADING"
# G4: take a picture of the tile (the node that carries the UPLOADING badge covers the whole tile). The script judges it afterwards
# (scripts/lib/thumbnail-check.mjs): a photo has many colours, a placeholder or an empty tile has one. It is not compared with a reference
# image: the crop is 168 x 173 px on one emulator image and 168 x 171 on another, and Maestro's assertScreenshot refuses a size mismatch.
# Wait for the screen to be still first, so the tile is not caught half drawn.
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot:
    path: g4-thumbnail-offline
    cropOn:
      text: "UPLOADING"
