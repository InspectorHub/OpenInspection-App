# G3 part A (regression strategy, section 3): sign in, download today's work, open the item, switch the engine OFF, add a photo from the
# library. The photo must sit on the device, waiting to upload. Part B (g3-b-after-restart.yaml) runs after the script has killed the app.
#
#   maestro --device <serial> test -e SERVER_URL=http://localhost:8791 -e CONTROL_URL=http://127.0.0.1:<port> maestro/golden/g3-a-offline-photo.yaml
#
# The engine must run with `--scenario inspection` (inspection insp-7, "77 Test Photo Lane" is visible to the signed-in inspector).
# Start from a clean, already-running app, as for G2, with maestro/fixtures/roof-photo.jpg already in the device's media index
# (scripts/android-emulator-offline-photo.sh does both).
appId: io.inspectorhub.app
---
- runFlow:
    file: g2-controlled-sign-in.yaml
    env:
      SERVER_URL: ${SERVER_URL}
# The sign-in flow leaves Settings scrolled when its last row was below the fold, and the button sits at the top: scroll back first.
- scrollUntilVisible:
    element: "Back to work list"
    direction: UP
    timeout: 30000
- tapOn: "Back to work list"
# The first sync after sign-in can still be running; the app then says so and the button needs another press a moment later.
- retry:
    maxRetries: 4
    commands:
      - tapOn: "Download today's work"
      - extendedWaitUntil:
          visible: "Updated 1 inspection."
          timeout: 20000
- tapOn: "Open 77 Test Photo Lane"
- extendedWaitUntil:
    visible: "ITEMS"
    timeout: 30000
- tapOn: "ITEMS"
- tapOn: "A Roof cover"
- assertVisible: "No photos yet"
# From here on the engine does not answer. The photo is taken while offline.
- runScript:
    file: scripts/engine-unavailable.js
    env:
      CONTROL_URL: ${CONTROL_URL}
      UNAVAILABLE: "true"
- tapOn: "Add photo"
- extendedWaitUntil:
    visible: "Add media"
    timeout: 10000
- tapOn: "Add from library"
# The system photo picker (Android 13+). The script pushed the fixture to /sdcard/Pictures and waited until the media index listed it BEFORE
# this flow started (Maestro's own addMedia put the file in just before the picker opened, and on API 34 the picker then said "No photos or
# videos": CI run 41415156795), so the one tile is ours.
- extendedWaitUntil:
    visible: "Photo taken on.*"
    timeout: 30000
- tapOn:
    text: "Photo taken on.*"
    index: 0
- takeScreenshot:
    path: g3-photo-selected
# The picker confirms a selection with "Done" on API 36 and with "Add (1)" on API 34 (seen in CI run 41413632011); a version that returns at
# once has no button at all. Maestro matches the whole text, so the count in "Add (1)" is part of the pattern. Either way the next step is
# a hard wait for the tile.
- tapOn:
    text: 'Done|Add \(\d+\)'
    optional: true
# Added while the engine is off: the tile shows the picture and says it is still on its way. Nothing was lost on the way in.
# The device link is still up (the app's online flag is link state only), so the photo first takes the upload path, and the server's silence
# is noticed when that request fails. The tile, its caption and the offline notice therefore settle one after another; each is waited for
# instead of judged at a single instant (a local run on a slow machine saw the tile first and the caption about a minute later).
- extendedWaitUntil:
    visible: "UPLOADING"
    timeout: 90000
- extendedWaitUntil:
    visible: "1 photo"
    timeout: 90000
- extendedWaitUntil:
    visible: "Can't reach the server"
    timeout: 90000
