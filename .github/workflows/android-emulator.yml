name: Android emulator smoke

# Android emulator checks for the debug APK (regression plan T2). It is its own workflow so a flaky emulator cannot hide behind, or be
# blamed on, the main CI jobs. It uses no secret and does not build the release APK; the debug manifest allows cleartext traffic, the
# release one does not.
#
# One emulator, two builds of the debug APK:
#   1. the BUNDLED build (assets inside the APK, as shipped): the launch smoke, G1 (first screen, no crash);
#   2. the DEV-SERVER build: the same app, but its WebView loads the Vite dev bundle from the runner (http://localhost:5173, forwarded by `adb reverse`; localhost is a secure context, a 10.0.2.2 address is not). Only a dev
#      bundle accepts plain http, and the fake engine (e2e/fake-engine) is plain http, so G2 (controlled sign-in, work list, Online,
#      nothing waiting) needs it. capacitor.config.ts honours OI_EMULATOR_DEV_SERVER only for that exact address, and only this
#      workflow sets it, on the second `cap sync`. The release build never sees it.
# G3 and G4 share a second engine (inspection scenario) and G5 has a third (published scenario): each flow needs state of its own.
# The launch smoke installs the bundled APK and does not depend on any dev-server step.
on:
  pull_request:
  # Also by hand (gh workflow run), so the emulator flows can be run on main without opening a pull request.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MAESTRO_VERSION: '2.12.0'
      MAESTRO_SHA256: 'a6044a84542f522f434c5dc3d609e60c7446d423f3ed1b2ae513f5c48663ec5e'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      - name: Build the debug APK (bundled assets)
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleDebug
      - name: Keep the bundled APK for the launch smoke
        run: |
          mkdir -p "$RUNNER_TEMP/apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/apk/app-debug-bundled.apk"
      - name: Sync again for the dev-server build (golden flows)
        env:
          OI_EMULATOR_DEV_SERVER: 'http://localhost:5173'
        run: npx cap sync android
      - name: Build the debug APK (WebView loads the Vite dev server)
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug
      - name: Keep the dev-server APK for the golden flows
        run: cp android/app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/apk/app-debug-devserver.apk"
      - name: Install Maestro (pinned release, checksum verified)
        run: |
          set -eu
          curl -fsSL --retry 3 --retry-all-errors -o "$RUNNER_TEMP/maestro.zip" "https://github.com/mobile-dev-inc/maestro/releases/download/cli-${MAESTRO_VERSION}/maestro.zip"
          echo "${MAESTRO_SHA256}  $RUNNER_TEMP/maestro.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/maestro.zip" -d "$RUNNER_TEMP/maestro-cli"
          echo "$RUNNER_TEMP/maestro-cli/maestro/bin" >> "$GITHUB_PATH"
      - name: Start the fake engine and the Vite dev server on the runner
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/android-smoke"
          nohup node e2e/fake-engine/serve.mjs --host 127.0.0.1 --port 8791 --allow-origin http://localhost:5173 > "$RUNNER_TEMP/android-smoke/fake-engine.log" 2>&1 &
          # G3 needs an inspection to open and a control server of its own (its flow switches this engine off), so it gets a second engine.
          nohup node e2e/fake-engine/serve.mjs --host 127.0.0.1 --port 8792 --scenario inspection --allow-origin http://localhost:5173 > "$RUNNER_TEMP/android-smoke/fake-engine-g3.log" 2>&1 &
          # G5 needs a published report to open, and a control server of its own (the test asks it what the app sent), so it gets a third engine.
          nohup node e2e/fake-engine/serve.mjs --host 127.0.0.1 --port 8793 --scenario published --allow-origin http://localhost:5173 > "$RUNNER_TEMP/android-smoke/fake-engine-g5.log" 2>&1 &
          nohup npx vite --host 127.0.0.1 --port 5173 --strictPort > "$RUNNER_TEMP/android-smoke/vite.log" 2>&1 &
          for i in $(seq 1 60); do
            # The Vite request for the entry module also warms its dependency optimiser, so the WebView's first load is not the slow one.
            if curl -fsS http://127.0.0.1:8791/api/client/compat > /dev/null && curl -fsS http://127.0.0.1:8792/api/client/compat > /dev/null && curl -fsS http://127.0.0.1:8793/api/client/compat > /dev/null && curl -fsS http://127.0.0.1:5173/src/main.tsx > /dev/null; then
              # The second engine prints where its control server listens (a free port) as its one line on stdout.
              node -e 'process.stdout.write(JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8").trim().split(/\s+/)[0]).control)' "$RUNNER_TEMP/android-smoke/fake-engine-g3.log" > "$RUNNER_TEMP/android-smoke/g3-control-url" || true
              [ -s "$RUNNER_TEMP/android-smoke/g3-control-url" ] || { echo "::error::the second fake engine did not print its control url"; cat "$RUNNER_TEMP/android-smoke/fake-engine-g3.log"; exit 1; }
              node -e 'process.stdout.write(JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8").trim().split(/\s+/)[0]).control)' "$RUNNER_TEMP/android-smoke/fake-engine-g5.log" > "$RUNNER_TEMP/android-smoke/g5-control-url" || true
              [ -s "$RUNNER_TEMP/android-smoke/g5-control-url" ] || { echo "::error::the third fake engine did not print its control url"; cat "$RUNNER_TEMP/android-smoke/fake-engine-g5.log"; exit 1; }
              echo "all servers answer"; exit 0
            fi
            sleep 1
          done
          echo "::error::a fake engine or the Vite server did not answer within 60 s"
          cat "$RUNNER_TEMP/android-smoke/fake-engine.log" "$RUNNER_TEMP/android-smoke/fake-engine-g3.log" "$RUNNER_TEMP/android-smoke/fake-engine-g5.log" "$RUNNER_TEMP/android-smoke/vite.log" || true
          exit 1
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Start the emulator, run the launch smoke (G1), the controlled sign-in flow (G2) and the offline photo flows (G3, G4) and the published report flow (G5)
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            bash scripts/android-emulator-smoke.sh "$RUNNER_TEMP/apk/app-debug-bundled.apk" "$RUNNER_TEMP/android-smoke"
            bash scripts/android-emulator-golden.sh "$RUNNER_TEMP/apk/app-debug-devserver.apk" http://localhost:8791 "$RUNNER_TEMP/android-smoke/g2"
            bash scripts/android-emulator-offline-photo.sh "$RUNNER_TEMP/apk/app-debug-devserver.apk" http://localhost:8792 "$(cat "$RUNNER_TEMP/android-smoke/g3-control-url")" "$RUNNER_TEMP/android-smoke/g3"
            bash scripts/android-emulator-published.sh "$RUNNER_TEMP/apk/app-debug-devserver.apk" http://localhost:8793 "$(cat "$RUNNER_TEMP/android-smoke/g5-control-url")" "$RUNNER_TEMP/android-smoke/g5"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: android-emulator-evidence
          path: ${{ runner.temp }}/android-smoke
          if-no-files-found: warn
          retention-days: 7
