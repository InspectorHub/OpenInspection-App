name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  ENGINE_CONTRACT_URL: https://raw.githubusercontent.com/InspectorHub/OpenInspection/main/contracts/native-contract.openapi.json

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npx vitest run
      - run: npm run build
      - name: Release bundle has no development-only UI
        run: npm run check:bundle
      - run: npx cap sync android
      - name: API types match the engine contract
        run: npm run api:types:check -- "$ENGINE_CONTRACT_URL"

  ios-sync:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx cap sync ios

  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npx vitest run
      - run: npm run build
      - run: npm run check:bundle
      - run: npm run build:electron
      - name: Record Windows HEIF and HEVC codec inventory
        shell: pwsh
        run: |
          $names = @('Microsoft.HEIFImageExtension', 'Microsoft.HEVCVideoExtension')
          $queryScope = 'all users'
          $packages = @()
          try {
            $packages = @(Get-AppxPackage -AllUsers -ErrorAction Stop | Where-Object { $_.Name -in $names })
          } catch {
            $allUsersError = $_.Exception.GetType().Name
            $queryScope = "current user (all-users query: $allUsersError)"
            try {
              $packages = @(Get-AppxPackage -ErrorAction Stop | Where-Object { $_.Name -in $names })
            } catch {
              $currentUserError = $_.Exception.GetType().Name
              $queryScope = "unavailable (all-users query: $allUsersError; current-user query: $currentUserError)"
            }
          }
          $inventory = if ($packages.Count -eq 0) { @('- No installed HEIF or HEVC extension packages were returned in the query scope.') } else { @($packages | Sort-Object Name | ForEach-Object { "- $($_.Name) $($_.Version) $($_.Architecture)" }) }
          @('### Windows HEIF and HEVC extension inventory', '', "- Query scope: $queryScope", '') + $inventory + @('') | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
      - name: Build the Windows HEIC helper
        run: npm run build:heic-helper
      - name: Record the helper SHA-256
        run: |
          $hash = (Get-FileHash -LiteralPath 'dist-electron/native/win-heic-helper.exe' -Algorithm SHA256).Hash.ToLowerInvariant()
          "### Windows HEIC helper`n`nSHA-256: ``$hash``" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-heic-helper
          path: dist-electron/native/win-heic-helper.exe
          if-no-files-found: error
          retention-days: 30
      - name: Check the Electron bundle
        run: npm run check:electron-bundle
      - name: Build the unpacked Windows package
        run: npx electron-builder --dir --win --x64 --config electron/builder/electron-builder.config.mjs --publish never
      - run: npm run check:electron-package
      - name: Build the E2E codec-missing helper
        run: npm run build:e2e-heic-helper
      - run: npx playwright test -c e2e-electron/playwright.config.ts --project=ci
