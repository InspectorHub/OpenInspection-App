name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  ENGINE_CONTRACT_URL: https://raw.githubusercontent.com/InspectorHub/OpenInspection/main/contracts/native-contract.openapi.json

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Unit tests, and the fake engine's answers against the engine contract
        # The fake engine (e2e/fake-engine) must answer as the real engine's contract says, or the golden flows go green against an engine
        # that no longer exists. With REQUIRE_ENGINE_CONTRACT a missing or unreadable contract fails the step instead of skipping the check.
        env:
          OPENINSPECTION_CONTRACT: ${{ env.ENGINE_CONTRACT_URL }}
          REQUIRE_ENGINE_CONTRACT: '1'
        run: npx vitest run
      - run: npm run build
      - name: Release bundle has no development-only UI
        run: npm run check:bundle
      - run: npx cap sync android
      - name: API types match the engine contract
        run: npm run api:types:check -- "$ENGINE_CONTRACT_URL"

  ios-sync:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx cap sync ios

  ios-simulator:
    name: ios-simulator (${{ matrix.device }})
    runs-on: macos-26
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        device: [iphone, ipad]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Sync iOS with Capacitor logging on (this simulator job only)
        env:
          OI_NATIVE_LOGGING: debug
        run: npx cap sync ios
      - name: Xcode is version 26 or newer
        run: |
          xcodebuild -version
          major="$(xcodebuild -version | sed -n 's/^Xcode \([0-9][0-9]*\).*/\1/p')"
          echo "Xcode major version: $major"
          test "$major" -ge 26
      - name: Restore the Swift package checkouts
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4 (the SHA the v4 tag pointed to on 2026-11-01)
        with:
          path: ${{ runner.temp }}/ios-build/SourcePackages
          key: swiftpm-${{ runner.os }}-${{ hashFiles('ios/App/CapApp-SPM/Package.swift', 'package-lock.json') }}
      - name: Compile for the iOS simulator
        run: >-
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug
          -sdk iphonesimulator -destination 'generic/platform=iOS Simulator'
          -derivedDataPath "$RUNNER_TEMP/ios-build" CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=YES build
      - name: GNU timeout, which the smoke script uses to bound every call to the simulator (macOS has none; coreutils provides gtimeout)
        run: command -v timeout || command -v gtimeout || brew install coreutils
      - name: Smoke-test launch, callback routing, privacy manifest and backup exclusion
        env:
          SMOKE_DEVICES: ${{ matrix.device }}
        run: bash scripts/ios-simulator-smoke.sh "$RUNNER_TEMP/ios-build/Build/Products/Debug-iphonesimulator/App.app" "$RUNNER_TEMP/ios-smoke"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ios-simulator-screenshots-${{ matrix.device }}
          path: ${{ runner.temp }}/ios-smoke
          if-no-files-found: warn
          retention-days: 7

  windows:
    name: windows (shard ${{ matrix.shard }}/3)
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Type-check (once; the shards do not repeat it)
        if: matrix.shard == 1
        run: npm run typecheck
      - name: Unit tests (this shard)
        run: npx vitest run --shard=${{ matrix.shard }}/3
      - run: npm run build
      - run: npm run check:bundle
      - run: npm run build:electron
      - name: Record Windows HEIF and HEVC codec inventory
        if: matrix.shard == 1
        shell: pwsh
        run: |
          $names = @('Microsoft.HEIFImageExtension', 'Microsoft.HEVCVideoExtension')
          $queryScope = 'all users'
          $packages = @()
          try {
            $packages = @(Get-AppxPackage -AllUsers -ErrorAction Stop | Where-Object { $_.Name -in $names })
          } catch {
            $allUsersError = $_.Exception.GetType().Name
            $queryScope = "current user (all-users query: $allUsersError)"
            try {
              $packages = @(Get-AppxPackage -ErrorAction Stop | Where-Object { $_.Name -in $names })
            } catch {
              $currentUserError = $_.Exception.GetType().Name
              $queryScope = "unavailable (all-users query: $allUsersError; current-user query: $currentUserError)"
            }
          }
          $inventory = if ($packages.Count -eq 0) { @('- No installed HEIF or HEVC extension packages were returned in the query scope.') } else { @($packages | Sort-Object Name | ForEach-Object { "- $($_.Name) $($_.Version) $($_.Architecture)" }) }
          @('### Windows HEIF and HEVC extension inventory', '', "- Query scope: $queryScope", '') + $inventory + @('') | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
      - name: Build the Windows HEIC helper
        run: npm run build:heic-helper
      - name: Record the helper SHA-256
        if: matrix.shard == 1
        run: |
          $hash = (Get-FileHash -LiteralPath 'dist-electron/native/win-heic-helper.exe' -Algorithm SHA256).Hash.ToLowerInvariant()
          "### Windows HEIC helper`n`nSHA-256: ``$hash``" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.shard == 1
        with:
          name: windows-heic-helper
          path: dist-electron/native/win-heic-helper.exe
          if-no-files-found: error
          retention-days: 30
      - name: Check the Electron bundle
        run: npm run check:electron-bundle
      - name: Build the unpacked Windows package
        run: npx electron-builder --dir --win --x64 --config electron/builder/electron-builder.config.mjs --publish never
      - run: npm run check:electron-package
      - name: Build the E2E codec-missing helper
        run: npm run build:e2e-heic-helper
      - name: Electron end-to-end tests (this shard)
        run: npx playwright test -c e2e-electron/playwright.config.ts --project=ci --shard=${{ matrix.shard }}/3
      - name: Upload Electron Playwright failure context
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: electron-playwright-failure-context-shard-${{ matrix.shard }}
          path: .superpowers/sdd/plan-d2-windows-electron/test-results/
          if-no-files-found: warn
          retention-days: 7

  # Golden flow G5 (a published report) on the iOS simulator, driven by Maestro against the fake engine over HTTPS. NOT one of the required
  # checks. The build has no App Transport Security exception, so the engine is HTTPS and its throwaway certificate is trusted in the
  # simulator by scripts/ios-simulator-published.sh. See docs/ios-published-flow.md.
  ios-simulator-published:
    name: ios-simulator-published (iphone)
    runs-on: macos-26
    timeout-minutes: 60
    env:
      MAESTRO_VERSION: '2.12.0'
      MAESTRO_SHA256: 'a6044a84542f522f434c5dc3d609e60c7446d423f3ed1b2ae513f5c48663ec5e'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      # Maestro is a Java program (17 or newer).
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm run build
      # No Capacitor logging here: src/release-workflows.test.ts lets only the ios-simulator job turn it on (it prints plugin calls and callback URLs).
      - run: npx cap sync ios
      - name: Xcode is version 26 or newer
        run: |
          xcodebuild -version
          major="$(xcodebuild -version | sed -n 's/^Xcode \([0-9][0-9]*\).*/\1/p')"
          echo "Xcode major version: $major"
          test "$major" -ge 26
      - name: Restore the Swift package checkouts
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4 (the SHA the v4 tag pointed to on 2026-11-01)
        with:
          path: ${{ runner.temp }}/ios-build/SourcePackages
          key: swiftpm-${{ runner.os }}-${{ hashFiles('ios/App/CapApp-SPM/Package.swift', 'package-lock.json') }}
      - name: Compile for the iOS simulator
        run: >-
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug
          -sdk iphonesimulator -destination 'generic/platform=iOS Simulator'
          -derivedDataPath "$RUNNER_TEMP/ios-build" CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=YES build
      - name: GNU timeout, which the scripts use to bound every call to the simulator (macOS has none; coreutils provides gtimeout)
        run: command -v timeout || command -v gtimeout || brew install coreutils
      - name: Install Maestro (pinned release, checksum verified before it is unpacked)
        run: |
          set -eu
          curl -fsSL --max-time 300 --retry 3 --retry-all-errors -o "$RUNNER_TEMP/maestro.zip" "https://github.com/mobile-dev-inc/maestro/releases/download/cli-${MAESTRO_VERSION}/maestro.zip"
          echo "${MAESTRO_SHA256}  $RUNNER_TEMP/maestro.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/maestro.zip" -d "$RUNNER_TEMP/maestro-cli"
          echo "$RUNNER_TEMP/maestro-cli/maestro/bin" >> "$GITHUB_PATH"
      - name: Make a throwaway TLS certificate for localhost and 127.0.0.1
        run: |
          set -eu
          dir="$RUNNER_TEMP/ios-published"
          mkdir -p "$dir"
          cat > "$dir/openssl.cnf" <<'CNF'
          [req]
          distinguished_name = dn
          x509_extensions = ext
          prompt = no
          [dn]
          CN = localhost
          [ext]
          basicConstraints = critical, CA:TRUE
          keyUsage = critical, digitalSignature, keyEncipherment, keyCertSign
          extendedKeyUsage = serverAuth
          subjectAltName = DNS:localhost, IP:127.0.0.1
          CNF
          openssl req -x509 -newkey rsa:2048 -nodes -sha256 -days 2 -config "$dir/openssl.cnf" -keyout "$dir/key.pem" -out "$dir/cert.pem"
          openssl x509 -in "$dir/cert.pem" -noout -subject -enddate
          openssl x509 -in "$dir/cert.pem" -noout -text | grep -A1 "Subject Alternative Name"
      - name: Start the fake engine (scenario published) over HTTPS
        run: |
          set -eu
          dir="$RUNNER_TEMP/ios-published"
          mkdir -p "$dir/out"
          nohup node e2e/fake-engine/serve.mjs --host 127.0.0.1 --port 0 --scenario published --tls-cert "$dir/cert.pem" --tls-key "$dir/key.pem" > "$dir/out/fake-engine.log" 2>&1 &
          for i in $(seq 1 60); do
            if [ -s "$dir/out/fake-engine.log" ] && head -1 "$dir/out/fake-engine.log" | grep -q '"control"'; then break; fi
            sleep 1
          done
          if ! { [ -s "$dir/out/fake-engine.log" ] && head -1 "$dir/out/fake-engine.log" | grep -q '"control"'; }; then
            echo "::error::the fake engine did not print its start line"; cat "$dir/out/fake-engine.log" || true; exit 1
          fi
          line="$(head -1 "$dir/out/fake-engine.log")"
          echo "engine said: $line"
          origin="$(node -e 'process.stdout.write(JSON.parse(process.argv[1]).origin)' "$line")"
          control="$(node -e 'process.stdout.write(JSON.parse(process.argv[1]).control)' "$line")"
          port="${origin##*:}"
          case "$origin" in https://*) ;; *) echo "::error::the engine is not serving https: $origin"; cat "$dir/out/fake-engine.log"; exit 1 ;; esac
          echo "https://localhost:${port}" > "$dir/engine-origin"
          echo "$control" > "$dir/control-url"
          # From the host: the certificate verifies (with a control: the same request WITHOUT the certificate must fail).
          curl -fsS --max-time 30 --cacert "$dir/cert.pem" "https://localhost:${port}/api/client/compat" > /dev/null
          if curl -fsS --max-time 30 "https://localhost:${port}/api/client/compat" > /dev/null 2>&1; then echo "::error::the certificate verified without being trusted"; exit 1; fi
          echo "the engine answers over https on port ${port}"
      - name: Golden flow G5 on the simulator (published report), engine side checked between the parts
        run: >-
          bash scripts/ios-simulator-published.sh
          "$RUNNER_TEMP/ios-build/Build/Products/Debug-iphonesimulator/App.app"
          "$(cat "$RUNNER_TEMP/ios-published/engine-origin")"
          "$(cat "$RUNNER_TEMP/ios-published/control-url")"
          "$RUNNER_TEMP/ios-published/cert.pem"
          "$RUNNER_TEMP/ios-published/out"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ios-simulator-published-evidence
          path: ${{ runner.temp }}/ios-published/out
          if-no-files-found: warn
          retention-days: 7
