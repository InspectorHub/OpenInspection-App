name: Release Windows

# A pushed vX.Y.Z tag verifies the package, rebuilds and (optionally) signs it, then creates a DRAFT Release.
# A manual run produces only the unsigned unpacked artifact; it never enters the protected environment.
# See docs/release.md.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-windows-${{ github.ref }}
  cancel-in-progress: false

env:
  ENGINE_CONTRACT_URL: https://raw.githubusercontent.com/InspectorHub/OpenInspection/main/contracts/native-contract.openapi.json

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Tag equals the package.json version
        if: github.ref_type == 'tag'
        run: |
          $version = node -p "require('./package.json').version"
          if ($env:GITHUB_REF_NAME -ne "v$version") {
            Write-Error "Tag $env:GITHUB_REF_NAME does not equal package.json version v$version. Bump package.json first, then tag."
            exit 1
          }
      - run: npm ci
      - run: npm run typecheck
      - run: npx vitest run
      - run: npm run build
      - name: Release bundle has no development-only UI
        run: npm run check:bundle
      - run: npm run build:electron
      - name: Build the Windows HEIC helper
        run: npm run build:heic-helper
      - name: Record the helper SHA-256
        run: |
          $hash = (Get-FileHash -LiteralPath 'dist-electron/native/win-heic-helper.exe' -Algorithm SHA256).Hash.ToLowerInvariant()
          "### Windows HEIC helper`n`nSHA-256: ``$hash``" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-heic-helper
          path: dist-electron/native/win-heic-helper.exe
          if-no-files-found: error
          retention-days: 30
      - name: Check the Electron bundle
        run: npm run check:electron-bundle
      - name: Build the unpacked Windows package
        run: npx electron-builder --dir --win --x64 --config electron/builder/electron-builder.config.mjs --publish never
      - run: npm run check:electron-package
      - name: API types match the engine contract
        run: npm run api:types:check -- "$env:ENGINE_CONTRACT_URL"
      - run: npx playwright test -c e2e-electron/playwright.config.ts --project=ci

  build:
    needs: verify
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run build:electron
      - name: Build the Windows HEIC helper
        run: npm run build:heic-helper
      - name: Build the unsigned unpacked Windows package
        run: npx electron-builder --win dir --x64 --config electron/builder/electron-builder.config.mjs --publish never
      - run: npm run check:electron-package
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-unsigned
          path: release-win/win-unpacked/
          if-no-files-found: error
          retention-days: 30

  sign:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: build
    runs-on: windows-latest
    timeout-minutes: 45
    environment: windows-release
    env:
      OI_WINDOWS_SIGNING: ${{ vars.OI_WINDOWS_SIGNING || 'none' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: npm ci
      - run: npm run build
      - run: npm run build:electron
      - name: Build the Windows HEIC helper
        run: npm run build:heic-helper
      - name: Sign the HEIC helper with Azure Artifact Signing
        if: env.OI_WINDOWS_SIGNING == 'azure'
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SIGNING_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          AZURE_SIGNING_PROFILE: ${{ vars.AZURE_SIGNING_PROFILE }}
        run: |
          Install-PackageProvider -Name NuGet -MinimumVersion 2.8.5.201 -Force -Scope CurrentUser
          Install-Module -Name TrustedSigning -MinimumVersion 0.5.0 -Force -Repository PSGallery -Scope CurrentUser
          $helper = (Resolve-Path 'dist-electron/native/win-heic-helper.exe').Path
          Invoke-TrustedSigning -Endpoint $env:AZURE_SIGNING_ENDPOINT -CertificateProfileName $env:AZURE_SIGNING_PROFILE -CodeSigningAccountName $env:AZURE_SIGNING_ACCOUNT -TimestampRfc3161 https://timestamp.acs.microsoft.com -TimestampDigest SHA256 -FileDigest SHA256 -Files $helper
      - name: Calculate the final helper SHA-256
        run: |
          $hash = (Get-FileHash -LiteralPath 'dist-electron/native/win-heic-helper.exe' -Algorithm SHA256).Hash.ToLowerInvariant()
          "### Packaged helper SHA-256`n`nSHA-256: ``$hash``" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-heic-helper-signed
          path: dist-electron/native/win-heic-helper.exe
          if-no-files-found: error
          retention-days: 30
      - name: Build the signed unpacked Windows package
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SIGNING_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          AZURE_SIGNING_PROFILE: ${{ vars.AZURE_SIGNING_PROFILE }}
          WINDOWS_PUBLISHER_NAME: ${{ vars.WINDOWS_PUBLISHER_NAME }}
        run: npx electron-builder --dir --win --x64 --config electron/builder/electron-builder.config.mjs --publish never
      - run: npm run check:electron-package
      - name: Build the NSIS installer
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SIGNING_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          AZURE_SIGNING_PROFILE: ${{ vars.AZURE_SIGNING_PROFILE }}
          WINDOWS_PUBLISHER_NAME: ${{ vars.WINDOWS_PUBLISHER_NAME }}
        run: npx electron-builder --win nsis --x64 --config electron/builder/electron-builder.config.mjs --publish never
      - run: npm run check:electron-package
      - name: Verify Authenticode and record publisher
        run: |
          $expected = if ($env:OI_WINDOWS_SIGNING -eq 'azure') { 'Valid' } else { 'NotSigned' }
          $files = @('release-win/win-unpacked/InspectorHub.exe', 'release-win/win-unpacked/resources/heic-helper/win-heic-helper.exe') + @(Get-ChildItem -LiteralPath 'release-win' -Filter 'InspectorHub-Setup-*.exe' -File | ForEach-Object { $_.FullName })
          foreach ($file in $files) {
            $signature = Get-AuthenticodeSignature -LiteralPath $file
            if ($signature.Status.ToString() -ne $expected) { throw "Unexpected Authenticode status for $file: $($signature.Status)" }
            if ($env:OI_WINDOWS_SIGNING -eq 'none' -and $signature.Status.ToString() -ne 'NotSigned') { throw "Unsigned pilot unexpectedly signed: $file" }
          }
          $publisher = if ($env:OI_WINDOWS_SIGNING -eq 'azure') { (Get-AuthenticodeSignature -LiteralPath 'release-win/win-unpacked/InspectorHub.exe').SignerCertificate.Subject } else { 'NotSigned (pilot)' }
          "### Windows signing`n`nMode: $env:OI_WINDOWS_SIGNING`n`nAuthenticode: $expected`n`nPublisher: $publisher" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
      - name: Create Windows SHA-256 checksums
        run: |
          $files = Get-ChildItem -LiteralPath 'release-win' -File | Where-Object { $_.Name -match '^InspectorHub-Setup-.*\.(exe|blockmap)$|^latest\.yml$' }
          if ($files.Count -lt 3) { throw 'The installer, blockmap, or latest.yml is missing.' }
          $lines = foreach ($file in $files) { "$( (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant() )  $($file.Name)" }
          $lines | Set-Content -LiteralPath 'release-win/SHA256SUMS-windows' -Encoding ascii
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-release
          path: |
            release-win/InspectorHub-Setup-*.exe
            release-win/*.blockmap
            release-win/latest.yml
            release-win/SHA256SUMS-windows
          if-no-files-found: error
          retention-days: 30

  release:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: sign
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: release-assets-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-release
          path: release
      - name: Create the draft Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
          files: |
            release/InspectorHub-Setup-*.exe
            release/*.blockmap
            release/latest.yml
            release/SHA256SUMS-windows
