name: Release iOS

# Written to the release plan and NOT yet run: it needs an Apple developer account, an App Store Connect app record and the
# secrets listed in docs/release.md. A pushed tag vX.Y.Z (equal to package.json's version) builds, signs and uploads a build to
# TestFlight, after scripts/ios-release-preflight.mjs has checked that the Apple secrets and variables are present. The build is
# xcodebuild archive and -exportArchive (argument spelling not yet verified on a runner). A manual run is refused unless it is
# started on a tag ref, so TestFlight only ever receives tagged builds. Nothing here submits for review or releases to the App Store.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-ios-${{ github.ref }}
  cancel-in-progress: false

env:
  ENGINE_CONTRACT_URL: https://raw.githubusercontent.com/InspectorHub/OpenInspection/main/contracts/native-contract.openapi.json
  BUNDLE_ID: io.inspectorhub.app

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Tag equals the package.json version
        if: github.ref_type == 'tag'
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not equal the package.json version ($expected). Bump package.json first, then tag."
            exit 1
          fi
      - run: npm ci
      - run: npm run typecheck
      - run: npx vitest run
      - run: npm run build
      - name: Release bundle has no development-only UI
        run: npm run check:bundle
      - run: npx cap sync android
      - name: API types match the engine contract
        run: npm run api:types:check -- "$ENGINE_CONTRACT_URL"

  testflight:
    if: github.ref_type == 'tag'
    needs: verify
    runs-on: macos-26
    timeout-minutes: 60
    environment: ios-release
    concurrency:
      group: release-assets-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Check the Apple credentials are present
        env:
          IOS_DISTRIBUTION_CERT_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERT_P12_BASE64 }}
          IOS_DISTRIBUTION_CERT_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERT_PASSWORD }}
          APPSTORE_API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
          APPSTORE_ISSUER_ID: ${{ vars.APPSTORE_ISSUER_ID }}
          APPSTORE_API_KEY_ID: ${{ vars.APPSTORE_API_KEY_ID }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: node scripts/ios-release-preflight.mjs
      - run: npm ci
      - run: npm run build
      - name: Set the iOS version from package.json and the build number from the run
        env:
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          node scripts/sync-ios-version.mjs --build-number "$((RUN_NUMBER * 100 + RUN_ATTEMPT))"
          node scripts/sync-ios-version.mjs --check
      - run: npx cap sync ios
      - name: Require Xcode 26 or newer
        run: |
          set -eu
          xcodebuild -version
          major="$(xcodebuild -version | sed -n 's/^Xcode \([0-9][0-9]*\).*/\1/p')"
          if [ -z "$major" ] || [ "$major" -lt 26 ]; then
            echo "::error::Xcode 26 or newer is required (found major version: ${major:-none})."
            exit 1
          fi
      - name: Warn when the encryption compliance code is not recorded
        run: |
          if ! grep -q 'ITSEncryptionExportComplianceCode' ios/App/App/Info.plist; then
            echo "::warning::Info.plist has no ITSEncryptionExportComplianceCode. App Store Connect will ask for export compliance on this build (docs/release.md)."
          fi
      - name: Import the distribution certificate
        uses: apple-actions/import-codesign-certs@77ba2a2a8f5cfc8c405ebf3159f767c323e238f9 # v7.1.0
        with:
          p12-file-base64: ${{ secrets.IOS_DISTRIBUTION_CERT_P12_BASE64 }}
          p12-password: ${{ secrets.IOS_DISTRIBUTION_CERT_PASSWORD }}
      - name: Download the App Store provisioning profile
        id: profiles
        uses: apple-actions/download-provisioning-profiles@230860ab5f632551a5f9a5e1d98a774485463888 # v7.0.0
        with:
          bundle-id: ${{ env.BUNDLE_ID }}
          profile-type: IOS_APP_STORE
          issuer-id: ${{ vars.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ vars.APPSTORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
      - name: Fill in ExportOptions.plist
        env:
          PROFILES: ${{ steps.profiles.outputs.profiles }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          set -eu
          profile="$(node -p "JSON.parse(process.env.PROFILES)[0].name")"
          mapping="$(PROFILE="$profile" node -p "JSON.stringify({ [process.env.BUNDLE_ID]: process.env.PROFILE })")"
          plutil -convert xml1 -o "$RUNNER_TEMP/ExportOptions.plist" ios/ExportOptions.plist
          plutil -replace teamID -string "$APPLE_TEAM_ID" "$RUNNER_TEMP/ExportOptions.plist"
          plutil -replace provisioningProfiles -json "$mapping" "$RUNNER_TEMP/ExportOptions.plist"
          plutil -lint "$RUNNER_TEMP/ExportOptions.plist"
      - name: Archive the app
        env:
          PROFILES: ${{ steps.profiles.outputs.profiles }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          set -eu
          profile="$(node -p "JSON.parse(process.env.PROFILES)[0].name")"
          xcodebuild archive \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$profile"
      - name: Export the IPA
        run: |
          set -eu
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"
      - name: Check the IPA before upload
        run: |
          set -eu
          if ! test -f "$RUNNER_TEMP/export/App.ipa"; then
            echo "::error::The export did not produce $RUNNER_TEMP/export/App.ipa. Files in the export directory:"
            ls -la "$RUNNER_TEMP/export" || true
            exit 1
          fi
          listing="$(unzip -l "$RUNNER_TEMP/export/App.ipa")"
          case "$listing" in
            *Payload/App.app/PrivacyInfo.xcprivacy*) ;;
            *) echo "::error::The IPA does not contain Payload/App.app/PrivacyInfo.xcprivacy."; exit 1 ;;
          esac
          rm -rf "$RUNNER_TEMP/ipa-check"
          mkdir -p "$RUNNER_TEMP/ipa-check"
          unzip -q "$RUNNER_TEMP/export/App.ipa" -d "$RUNNER_TEMP/ipa-check"
          app="$RUNNER_TEMP/ipa-check/Payload/App.app"
          codesign -dvv "$app" 2> "$RUNNER_TEMP/ipa-check/codesign.txt"
          if ! grep -q 'Authority=Apple Distribution' "$RUNNER_TEMP/ipa-check/codesign.txt"; then
            echo "::error::The app in the IPA is not signed by an Apple Distribution certificate."
            exit 1
          fi
          encryption="$(plutil -extract ITSAppUsesNonExemptEncryption raw -o - "$app/Info.plist")"
          if [ "$encryption" != "true" ]; then
            echo "::error::ITSAppUsesNonExemptEncryption in the IPA is not true (found: $encryption)."
            exit 1
          fi
          echo "ok: the IPA exists, contains the privacy manifest, is signed by Apple Distribution and declares its encryption use"
      - name: Upload to TestFlight
        uses: apple-actions/upload-testflight-build@acf1166e95edc302069b74b258a788004fe39a08 # v5.7.0
        with:
          app-path: ${{ runner.temp }}/export/App.ipa
          app-type: ios
          issuer-id: ${{ vars.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ vars.APPSTORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
          uses-non-exempt-encryption: 'true'
